name: stellantis-challenge

services:
  mysql:
    image: mysql:8.4
    container_name: stellantis-mysql-dev
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: senha
      MYSQL_DATABASE: stellantis_db
      TZ: America/Sao_Paulo
    ports:
      - "3306:3306"
    volumes:
      - mysql-dev-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-psenha"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - rede-stellantis

  api:
    image: eclipse-temurin:21-jdk-alpine
    container_name: stellantis-api-dev
    restart: "no"
    working_dir: /app
    volumes:
      - ./backend:/app
      - ~/.m2:/root/.m2
    command: ./mvnw spring-boot:run
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/stellantis_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: senha
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      TZ: America/Sao_Paulo
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - rede-stellantis

volumes:
  mysql-dev-data:

networks:
  rede-stellantis:
    driver: bridge